name: Publish PDFs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Stage tracked PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/application-samples
          cp pages/index.html _site/index.html
          cp paper/paper.pdf _site/paper.pdf
          cp application-samples/output/RishavRoy_WritingSample_5pg.pdf _site/application-samples/
          cp application-samples/output/RishavRoy_WritingSample_10pg.pdf _site/application-samples/
          cp application-samples/output/RishavRoy_WritingSample_15pg.pdf _site/application-samples/
          cp application-samples/output/RishavRoy_WritingSample_Full.pdf _site/application-samples/
          cp application-samples/output/RishavRoy_CodingSample_Short.pdf _site/application-samples/
          cp application-samples/output/RishavRoy_CodingSample.pdf _site/application-samples/
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
