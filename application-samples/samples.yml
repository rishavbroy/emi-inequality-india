schema_version: 1
paper:
  source: paper/paper.qmd
  full_paper_url: https://rishavbroy.github.io/emi-inequality-india/paper.pdf
  repository_url: https://github.com/rishavbroy/emi-inequality-india
identity:
  named:
    author: Rishav Roy
    prefix: RishavRoy
  anonymous:
    author: Anonymous
    prefix: Anon
    acknowledgment_names:
      - Laura Schechter
      - Corina Mommaerts
      - Agustín Gutiérrez
    acknowledgment_replacement: "[my professors]"
    forbidden_strings:
      - Rishav Roy
      - rishavbroy
      - github.com/rishavbroy
writing:
  - id: 5pg
    target_pages: 5
    sections:
      - sec-intro
    figures:
      - fig-schooling-geography
  - id: 10pg
    target_pages: 10
    sections:
      - sec-intro
      - sec-schooling-menu
      - sec-schooling-market
      - sec-social-access
  - id: 15pg
    target_pages: 15
    sections:
      - sec-intro
      - sec-schooling-menu
      - sec-schooling-market
      - sec-social-access
      - sec-consumption-emi
      - sec-consumption-complements
      - sec-discussion
  - id: Under5MB
    label: UNDER-5MB COPY
    max_bytes: 5000000
    selective_rasterization: true
    sections:
      - sec-intro
      - sec-schooling-menu
      - sec-schooling-market
      - sec-social-access
      - sec-consumption-emi
      - sec-consumption-complements
      - sec-discussion
  - id: Under10MB
    label: UNDER-10MB COPY
    mode: full
    max_bytes: 10000000
    selective_rasterization: true
  - id: full
    mode: full
coding_outputs:
  selection_ame:
    type: latex
    file: outputs/tables/appendix/appendix_selection_ame.tex
    paper_label: tbl-appendix-selection-ame
  weak_iv:
    type: latex
    file: outputs/tables/appendix/appendix_iv_weak_inference.tex
    paper_label: tbl-app-iv-weak
    code_files:
      - R/iv/estimate_2sls.R
      - R/iv/consumption_outcome_registry.R
      - R/output/appendix_identification_exhibits.R
      - R/output/save_tables.R
  consumption_validation:
    type: figure
    paper_label: fig-app-consumption-hces
  main_maps:
    type: figure
    paper_label: fig-schooling-geography
  historical_language_persistence:
    type: figure
    paper_label: fig-linguistic-persistence
coding:
  - id: short
    excerpts:
      - id: code-language-atlas-validation
        file: scripts/build_language_atlas_1991.py
        title: Reconstructing District Data from the 1991 Language Atlas
        description: >-
          Annexure IV repeats district rows across eight language pages. Exact repeated labels can recover a serial number omitted on one page, but conflicting evidence remains unresolved; candidate district identities are then checked against official 1991 Primary Census Abstract populations before acceptance.
        outputs:
          - historical_language_persistence
      - id: code-survey-design
        file: R/selection/estimate_selection_probit.R
        title: Constructing the NSS Survey Design
        description: >-
          The enrollment model uses household sampling weights, sampled villages or urban blocks as primary sampling units, and strata formed from state, sector, stratum, and substratum. Final estimation requires all survey-design fields rather than silently falling back to an incomplete design.
      - id: code-ame-estimation
        file: R/selection/compute_average_marginal_effects.R
        title: Average Marginal Effects on the Estimation Sample
        description: >-
          Response-scale average marginal effects are delegated to `marginaleffects::avg_slopes()`. The fitted model frame and NSS sampling weights are passed explicitly so the averaging population remains the survey estimation sample after model serialization.
      - id: code-mop-effective-f
        file: R/iv/weak_identification.R
        title: Assessing Weak-Instrument Strength with the Montiel Olea--Pflueger Effective F
        description: >-
          The fitted instrumental-variable model is passed to `momentfit::MOPtest()`, using state clusters when they are available, to obtain the Montiel Olea--Pflueger effective F, critical value, p-value, and effective degrees of freedom. The table below also contains two-stage least squares (2SLS) and Anderson--Rubin results produced by the additional implementation files linked immediately before the table.
        outputs:
          - weak_iv
      - id: code-public-map-rendering
        file: R/output/save_figures.R
        title: Mapping District Estimates on 2001 Census Boundaries
        description: >-
          Each statistic is joined to the complete 2001 Census district boundary layer, leaving districts outside a particular estimation sample visible as missing data. Disputed territorial polygons are shown as no data, state outlines are reconstructed from the complete boundary layer, and the same functions draw categorical or numeric choropleths, including diverging scales.
        outputs:
          - main_maps
      - id: code-temporal-price-series
        file: R/prices/build_temporal_price_series.R
        title: Linking Rural and Urban State CPI Series Across Index Bases
        description: >-
          Old and new rural and urban state CPI series are linked over their January 2013--December 2014 overlap using the median monthly ratio of the new index to the old index. At least six common months are required, and the returned data retain the overlap counts and ratio dispersion used to assess sensitivity to the link period.
      - id: code-state-sector-deflator
        file: R/prices/price_deflators.R
        title: Rural and Urban State Price Deflators for Comparable Real Consumption
        description: >-
          The linked rural and urban CPI series is combined with state-specific price relatives for rural and urban areas derived from Tendulkar poverty lines. The resulting deflators express survey consumption in comparable 2011--12 rupees; the figure below compares district estimates across the 2022--23 and 2023--24 Household Consumption Expenditure Survey (HCES) rounds.
        outputs:
          - consumption_validation
      - id: code-price-link-tests
        file: tests/testthat/test-prices-and-controls.R
        title: Behavioral Tests for CPI Linking
        description: >-
          Synthetic state-sector series verify the overlap rule directly: link factors equal the median month-by-month ratio, retain the number of common months, and reject a pre-switch series when the overlap is too short to meet the minimum evidence requirement.
  - id: long
    excerpts:
      - id: code-district-carveout-repair
        file: R/io/read_inputs.R
        title: Reconstructing District Boundary Transfers Between 1991 and 2001
        description: >-
          A headerless historical table records how the population of each 1991 district was divided among 2001 districts. Wrapped district names are joined only when the row structure identifies a continuation; every transfer percentage is checked, and the shares leaving each 1991 district must sum to 100 within rounding tolerance.
