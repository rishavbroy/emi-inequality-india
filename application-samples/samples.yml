coding:
  - id: main
    excerpts: &main_code_excerpts
      - id: code-district-carveout-repair
        file: R/io/read_inputs.R
        section: Historical Geography and Measurement
        title: Reconstructing District Boundary Transfers Between 1991 and 2001
        description: >-
          [Kumar and Somanathan's (2016)](http://www.cdedse.org/pdf/work248.pdf) district concordance reports how the population of each 1991 district was distributed across 2001 districts after boundary changes. Some district names wrap onto a second line in the original table, leaving the 1991 population blank on that line. I inspect those rows before filling down repeated values. If a wrapped line contains transfer percentages, I retain it as a separate allocation record and restore its 1991 district name and population. If it contains only text, I join that text to the district name on the preceding line and remove the extra row. After reconstructing the table, I verify that the shares of each 1991 district's population assigned to 2001 districts sum to 100%, allowing 0.05 percentage points for rounding.
      - id: code-lineage-candidate-scoring
        file: R/districts/lineage_matching.R
        title: Generating District Match Candidates for Review
        description: >-
          District names vary across survey waves and reference years. For each survey district, I compare only reference districts in the same state. I compute Jaro--Winkler, normalized Damerau--Levenshtein, trigram cosine, and token Jaccard similarities for every candidate pair and average the four scores. I prefer 2001 reference districts for the 2007--08 NSS and 2011 reference districts for later waves. I flag a pair for review only when the survey district and reference district rank each other first and their directional terms agree. I also require Jaro--Winkler similarity of at least 0.90, normalized Damerau--Levenshtein similarity of at least 0.70, trigram similarity of at least 0.55, and a margin of at least 0.05 over the next candidate name. Token Jaccard enters the average score without an additional threshold. I retain the highest-ranked candidates for subsequent district lineage review.
      - id: code-language-atlas-validation
        file: scripts/build_language_atlas_1991.py
        title: Reconstructing District Data from the 1991 Language Atlas
        description: >-
          In the 1991 Census Language Atlas, each district appears on eight different pages of language data. Each district's printed identifier combines its Census state code with a serial number within the state, but some repeated copies omit the serial or contain text extraction errors. When the current row has no serial, I use the repeated copies only if the exact same printed row label within the same Atlas block is associated with one serial number throughout. I then verify that the state headings cover the complete reviewed set of 1991 states and agree with the state codes in the Primary Census Abstract. I accept a reconstructed district only when its state and district codes identify one Primary Census Abstract district and the Atlas population is within 1% of that district's Census population.
      - id: code-historical-linguistic-distance-bounds
        file: R/measures/build_linguistic_distance_iv.R
        title: Bounding Historical Linguistic Distance with Unresolved Population Counts
        description: >-
          After reconciling language names, some district population remains attached to language entries without an accepted Shastry distance. For each district, I first calculate the speaker-weighted mean among accepted languages with a positive distance. Hindi and other zero-distance counts, along with native English counts, are already resolved and do not enter that mean. I then calculate how far the mean could vary if all unresolved population were assigned the smallest or largest accepted positive Shastry degree. I also include the observed mean because unresolved counts can belong to groups that do not enter the positive-distance denominator. I use the preferred historical measure only when accepted counts cover at least 99% of the district population and the resulting interval is no wider than 0.5 Shastry degree.
        outputs:
          - historical_language_persistence
      - id: code-dise-report-language-enrollment
        file: scripts/build_dise_report_language_enrollment.py
        section: Independent Schooling Measures and Survey Estimation
        title: Reconstructing English-Medium Enrollment from Archived DISE Reports
        description: >-
          I use District Information System for Education (DISE) district report cards from 2008--09 through 2014--15 to construct an independent measure of English-medium enrollment. For each reviewed page, I run Poppler's `pdftotext -layout` so that the extracted text retains the page spacing as far as possible. When languages appear in rows, I require a nearby `Total` header and read the final number on each English or Hindi row. When languages appear in columns, I locate the English and Hindi headings and read the nearest number on an explicit `Total` or `Grand Total` row. I reconstruct every recorded district and year from its reviewed page and check the resulting counts against the saved count table. If several archived reports cover the same district and year, the recorded report priority must select one report uniquely.
      - id: code-survey-design
        file: R/selection/estimate_selection_probit.R
        title: Constructing the NSS Survey Design
        description: >-
          In the 2007--08 National Sample Survey education round, households are sampled within first-stage units such as villages and urban blocks. For the enrollment probit, I define each sampling stratum from state, rural/urban sector, stratum, and substratum. I use the household multiplier as the sampling weight and the first-stage unit number as the cluster identifier. I pass these variables to `survey::svydesign()` with `nest = TRUE`, which relabels repeated cluster identifiers within strata. I fit the final survey-weighted probit only when all six required survey design fields are present.
      - id: code-ame-estimation
        file: R/selection/compute_average_marginal_effects.R
        title: Average Marginal Effects on the Estimation Sample
        description: >-
          For each fitted enrollment probit, I recover the observations actually used in estimation from its model frame and obtain the corresponding NSS sampling weights from the fitted survey design. I require one finite, nonnegative weight for each fitted observation and a positive total weight. I then pass those observations through `newdata` and the sampling weights through `wts` to `marginaleffects::avg_slopes()`. I use the model's survey-based covariance matrix for uncertainty estimates. For continuous covariates, I report average slopes on the predicted probability scale. For binary and categorical covariates, `marginaleffects` computes average discrete comparisons.
        outputs:
          - selection_ame
      - id: code-mop-effective-f
        file: R/iv/weak_identification.R
        section: Identification and Econometric Robustness
        title: Assessing Weak-Instrument Strength with the Montiel Olea--Pflueger Effective F
        description: >-
          I use linguistic distance from Hindi as an instrument for district exposure to English-medium schooling. For each IV specification with one endogenous regressor, I recover the fitted regression formula, instrument formula, estimation observations, and state clusters from the `ivreg` fit. I then construct the corresponding `momentfit` model and call `MOPtest()` with a benchmark of 10% relative bias for TSLS, a 5% test size, and the simplified critical value. I report the resulting effective F and critical value as the instrument-strength results under the covariance assumptions used by the test. The accompanying table places these results beside the two-stage least squares estimates and Anderson--Rubin inference.
        outputs:
          - weak_iv
      - id: code-falsification-adaptive-set
        file: R/iv/falsification_adaptive_set.R
        title: Constructing Falsification-Adaptive Sets for Overidentified IV Designs
        description: >-
          I use the falsification-adaptive set to assess how the estimated effect changes when the exclusion restrictions are relaxed one instrument at a time. For each candidate instrument, I estimate a just-identified two-stage least squares specification in which that instrument remains excluded and the other candidate instruments enter as controls. I use the same observations for every constituent estimate by requiring complete data on all variables in the full specification, and I cluster inference by state. The lower and upper endpoints of the FAS are the smallest and largest constituent estimates. I also report each instrument's conditional first-stage statistic as evidence about the maintained relevance assumption.
      - id: code-temporal-price-series
        file: R/prices/build_temporal_price_series.R
        section: Price Harmonization and Real Consumption
        title: Linking Historical and Later State CPI Series onto a Common Scale
        description: >-
          For rural areas, I link the historical CPI-RL to the later state rural CPI. For urban areas, I link the state CPI-IW to the later state urban CPI. Within each state and rural/urban sector, I calculate the ratio of the later CPI to the historical CPI for every paired month from January 2013 through December 2014 and use the median ratio as the link factor. I require at least six paired months for every historical series used before January 2013. I also retain the first and last monthly ratios, the median absolute deviation, the minimum and maximum ratios, and the number of paired months. I multiply the historical observations by the link factor before January 2013 and use the later CPI directly from January 2013 onward.
      - id: code-state-sector-deflator
        file: R/prices/price_deflators.R
        title: Constructing Comparable Rural and Urban Price Deflators Across States
        description: >-
          I express household consumption on a common 2011--12 price scale in two steps. First, I divide each state's rural or urban Tendulkar poverty line by ₹816, the all-India rural Tendulkar line for 2011--12. I use this ratio to account for differences in price levels across states and between rural and urban areas. Second, I divide each month's CPI by the corresponding 2011--12 reference CPI to measure price change over time. I multiply these two ratios to obtain the monthly deflator. At the reference period, an amount equal to the applicable Tendulkar poverty line therefore equals ₹816 on the common real consumption scale. When a state uses a declared donor CPI series, I use the donor state's reference CPI in the denominator as well. I then compare district real consumption estimates from the 2022--23 and 2023--24 Household Consumption Expenditure Survey rounds in the accompanying figure.
        outputs:
          - consumption_validation
      - id: code-price-link-tests
        file: tests/testthat/test-prices-and-controls.R
        title: Testing CPI Links Against Known Answers
        description: >-
          I test the CPI linking rule with values whose correct answer can be checked by hand. In the rural example, the monthly ratios of the later CPI to the historical CPI are 2, 2, and 3, so the median link is 2 even though the final monthly ratio is 3. In the urban example, all three ratios equal 0.5. I check the median link, the first and last ratios, and the number of paired months.
      - id: code-public-map-rendering
        file: R/output/save_figures.R
        section: Spatial Presentation on a Common Geography
        title: Preserving All 2001 Census Districts in Published Maps
        description: >-
          For each published district map, I begin with the full reviewed 2001 Census district geometry and join the analysis values by district identifier. Every 2001 Census district therefore remains in the figure; districts without an estimate appear in the explicit "No data" category. I derive each state code from the 2001 Census district identifier and compare it with any state code supplied with the analysis values. I then use the completed district table to draw the geographic figure.
        outputs:
          - main_maps
  - id: Under10MB
    label: UNDER-10MB COPY
    max_bytes: 10000000
    selective_rasterization: true
    excerpts: *main_code_excerpts
