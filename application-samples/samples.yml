coding:
  - id: main
    excerpts: &main_code_excerpts
      - id: code-district-carveout-repair
        file: R/io/read_inputs.R
        section: Historical Geography and Measurement
        title: Reconstructing District Boundary Transfers Between 1991 and 2001
        description: >-
          A historical Census table reports how each 1991 district's population was apportioned among 2001 districts after boundary changes. A blank 1991 population cell identifies a candidate continuation row in the headerless Census table: transfer fields distinguish an allocation record from a row that only continues a printed district name. Structural repair runs before ordinary fill-down because those blank cells carry layout information; continuation rows that contain transfer shares remain observations after the full 1991 district name and population are restored. The reader requires each 1991 district's population shares across 2001 successor districts to sum to 100% within 0.05 percentage points.
      - id: code-lineage-candidate-scoring
        file: R/districts/lineage_matching.R
        title: Generating District Match Candidates for Review
        description: >-
          District names vary across survey waves and reference years, so standardized names rank candidates for subsequent district lineage review. Within each state, the code averages Jaro--Winkler, normalized Damerau--Levenshtein, trigram cosine, and token Jaccard similarities. The preferred reference year depends on survey wave: 2001 is preferred for the 2007--08 NSS and 2011 for later waves. The review flag also requires the survey district and reference district to rank each other first, compatible directional terms, Jaro--Winkler >= 0.90, normalized Damerau--Levenshtein >= 0.70, trigram similarity >= 0.55, and a score margin >= 0.05 over the runner-up. Token Jaccard contributes to the composite score without a separate cutoff. The resulting candidates then enter the reviewed district lineage process.
      - id: code-language-atlas-validation
        file: scripts/build_language_atlas_1991.py
        title: Reconstructing District Data from the 1991 Language Atlas
        description: >-
          The 1991 Census Language Atlas repeats each district across eight language pages. Districts are identified by a Census state code plus a serial within the state, but some repeated rows omit the serial or contain errors introduced during text extraction. When a row itself has no serial, the code recovers one only if the same raw row label within the same Atlas block has exactly one distinct serial across repeated pages. Before a district row can be promoted, the parser requires the observed state headings to equal the complete reviewed set of 1991 states and the state codes in the Primary Census Abstract. Promotion then requires two independent checks: the reconstructed state and district code pair must identify a unique official 1991 Primary Census Abstract district, and the Atlas population must be within 1% of that district's Census population.
      - id: code-historical-linguistic-distance-bounds
        file: R/measures/build_linguistic_distance_iv.R
        title: Bounding Historical Linguistic Distance with Unresolved Population Counts
        description: >-
          Some 1991 Language Atlas population remains unresolved after language name reconciliation. The code carries that population into explicit bounds on the speaker-weighted distance measure. It separates accepted speakers whose distance is positive from known groups excluded from that mean (zero distance and native English speakers), then allows unresolved population either to leave the mean unchanged or to take any value on the positive distance support observed in the reviewed preferred mapping. The preferred historical measure requires at least 99% accepted speaker coverage and a worst case bound no wider than 0.5 Shastry degree.
        outputs:
          - historical_language_persistence
      - id: code-dise-report-language-enrollment
        file: scripts/build_dise_report_language_enrollment.py
        section: Independent Schooling Measures and Survey Estimation
        title: Reconstructing English-Medium Enrollment from Archived DISE Reports
        description: >-
          District Information System for Education (DISE) report cards from 2008--09 through 2014--15 provide an independent validation of the NSS English-medium measure. Reviewed pages are converted with Poppler's `pdftotext -layout`, which preserves the physical text layout as far as possible. For tables with languages in rows, the parser requires a nearby `Total` header and takes the final numeric entry on each English or Hindi row. For tables with languages in columns, it locates the language headings and reads the nearest numeric entry on an explicit `Total` or `Grand Total` row. The full script reconstructs each registered district and year from its reviewed page and compares the result with the tracked count table. When several reports cover the same district and year, the recorded report priority must select exactly one.
      - id: code-survey-design
        file: R/selection/estimate_selection_probit.R
        title: Constructing the NSS Survey Design
        description: >-
          The 2007--08 National Sample Survey (NSS) education survey samples households within first-stage units such as villages or urban blocks. This function defines each sampling stratum by state, rural/urban sector, stratum, and substratum, supplies the household multiplier as the sampling weight, and creates the `survey::svydesign()` used for the enrollment probit. In the `survey` package, `nest = TRUE` relabels cluster identifiers to enforce nesting within strata. Final estimation requires all six design fields before fitting the survey-weighted probit.
      - id: code-ame-estimation
        file: R/selection/compute_average_marginal_effects.R
        title: Average Marginal Effects on the Estimation Sample
        description: >-
          The code recovers the fitted model frame and NSS sampling weights stored with the enrollment probit, verifies one finite nonnegative weight per fitted observation and positive total weight, and passes both to `marginaleffects::avg_slopes()`. The fitted survey design determines model estimation and its covariance matrix. `newdata` fixes evaluation at the fitted observations, while `wts` determines the weighted average of observation level quantities on the response scale. Continuous regressors are summarized by average response-scale slopes; for binary and categorical regressors, `marginaleffects` reports discrete comparisons.
        outputs:
          - selection_ame
      - id: code-mop-effective-f
        file: R/iv/weak_identification.R
        section: Identification and Econometric Robustness
        title: Assessing Weak-Instrument Strength with the Montiel Olea--Pflueger Effective F
        description: >-
          The paper uses linguistic distance from Hindi as an instrument for district exposure to English-medium schooling. For specifications with one endogenous regressor, this function evaluates first-stage strength with the Montiel Olea--Pflueger effective F, using `momentfit::MOPtest()` with a 10% relative-bias benchmark for TSLS, 5% test size, and the conservative simplified critical value. It reconstructs the fitted regression and instrument formulas, checks the variables they require, and verifies that state clusters align with the fitted observations before constructing the MOP moment model. The table reports the effective F alongside two-stage least squares and Anderson--Rubin inference robust to weak identification.
        outputs:
          - weak_iv
      - id: code-falsification-adaptive-set
        file: R/iv/falsification_adaptive_set.R
        title: Constructing Falsification-Adaptive Sets for Overidentified IV Designs
        description: >-
          Under the exclusion relaxation used here, one endogenous regressor and multiple instruments assumed relevant yield a falsification-adaptive set spanning just-identified IV estimands. Each instrument serves in turn as the sole excluded instrument while the remaining instruments enter as controls. All constituent estimates use the same observations, requiring complete data on every variable in the registered specification, and inference is clustered by state. Every registered constituent enters the FAS calculation. Conditional first-stage statistics separately summarize evidence on instrument relevance.
      - id: code-temporal-price-series
        file: R/prices/build_temporal_price_series.R
        section: Price Harmonization and Real Consumption
        title: Linking Historical and Later State CPI Series onto a Common Scale
        description: >-
          Historical CPI-RL for rural areas and state CPI-IW for urban areas are linked to the later state rural/urban CPI (CPI-R/U). For each state and rural/urban sector, the link is the median monthly ratio of CPI-R/U to the historical CPI over January 2013--December 2014, reducing sensitivity to any one overlap month. Every historical series used before January 2013 must have at least six paired months in that interval. The link summary retains the number of paired months, first and last ratios, median absolute deviation, and range. The overlap interval estimates the link; the combined monthly series uses CPI-R/U itself from January 2013 onward and verifies that the intended CPI family appears on each side of the switch.
      - id: code-state-sector-deflator
        file: R/prices/price_deflators.R
        title: Constructing Comparable Rural and Urban Price Deflators Across States
        description: >-
          The code uses each state and rural/urban Tendulkar poverty line divided by the all-India rural 2011--12 line of ₹816 as its spatial price relative. Production supplies a separately validated 2011--12 reference CPI table; the helper can also calculate a reference mean directly when used independently. For each month, the deflator multiplies the Tendulkar spatial relative by the CPI relative to that reference period. At the reference period, a nominal amount equal to the applicable Tendulkar poverty line therefore equals ₹816 on the common real-consumption scale. When a state relies on a declared donor CPI series, the donor state's reference CPI is used as well so the temporal numerator and denominator come from the same series. The figure provides a downstream check on the resulting real-consumption measures by comparing district estimates from the 2022--23 and 2023--24 Household Consumption Expenditure Survey rounds.
        outputs:
          - consumption_validation
      - id: code-price-link-tests
        file: tests/testthat/test-prices-and-controls.R
        title: Testing CPI Links Against Known Answers
        description: >-
          A small rural example has monthly ratios of the later CPI to the historical CPI equal to 2, 2, and 3, so the median link is 2 while the final overlap ratio is 3. The urban example has a constant ratio of 0.5. The test verifies the median link, the first and last overlap ratios, and the number of paired months.
      - id: code-public-map-rendering
        file: R/output/save_figures.R
        section: Spatial Presentation on a Common Geography
        title: Preserving All 2001 Census Districts in Published Maps
        description: >-
          Published district maps begin with the full reviewed 2001 Census district geometry. Analysis values are joined by district identifier, so every district remains in the figure and missing estimates appear as the explicit "No data" category. State codes are derived from the 2001 Census district identifiers and checked against any state codes supplied with the analysis values. The completed district table is then passed to the shared geographic figure builder.
        outputs:
          - main_maps
  - id: Under10MB
    label: UNDER-10MB COPY
    max_bytes: 10000000
    selective_rasterization: true
    excerpts: *main_code_excerpts
