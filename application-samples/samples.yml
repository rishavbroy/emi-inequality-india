coding:
  - id: main
    excerpts: &main_code_excerpts
      - id: code-district-carveout-repair
        file: R/io/read_inputs.R
        section: Historical Geography and Measurement
        title: Reconstructing District Boundary Transfers Between 1991 and 2001
        description: >-
          A historical Census table reports how each 1991 district's population was apportioned among 2001 districts after boundary changes. A blank 1991-population cell identifies a candidate continuation row in the headerless source: transfer fields distinguish a genuine allocation record from a row that only continues a printed district name. Structural repair runs before ordinary fill-down because those blank cells themselves carry layout information; transfer-bearing continuation rows remain observations after their source identity is reconstructed. The reader requires each 1991 source population's shares across 2001 successor districts to sum to 100% within 0.05 percentage points.
      - id: code-lineage-candidate-scoring
        file: R/districts/lineage_matching.R
        title: Generating High-Precision District-Match Candidates
        description: >-
          District names vary across survey waves and administrative vintages, so standardized names generate review candidates rather than establish identity by themselves. Within each state, the code averages Jaro--Winkler, normalized Damerau--Levenshtein, trigram cosine, and token Jaccard similarities to rank candidates. Reference-vintage preference is survey-wave-specific, favoring 2001 for the 2007--08 NSS and 2011 for later waves. A high-precision review flag additionally requires reciprocal nearest-neighbor agreement, compatible directional tokens, Jaro--Winkler >= 0.90, normalized Damerau--Levenshtein >= 0.70, trigram similarity >= 0.55, and a score margin >= 0.05 over the runner-up. Token Jaccard contributes to the composite score but has no separate cutoff; downstream lineage adjudication still decides whether a candidate becomes an accepted geographic link.
      - id: code-language-atlas-validation
        file: scripts/build_language_atlas_1991.py
        title: Reconstructing District Data from the 1991 Language Atlas
        description: >-
          The 1991 Census Language Atlas repeats each district across eight language pages. Districts are identified by a Census state code plus a within-state serial, but some repeated rows omit the serial or contain errors introduced during text extraction. When a row itself has no serial, the code recovers one only if the same raw row label within the same Atlas block has exactly one distinct serial across repeated pages. Before row-level promotion, the parser also requires the complete set of observed state headings to match the reviewed 1991 state universe and the Primary Census Abstract. Promotion then requires two independent checks: the reconstructed state--district code must identify a unique official 1991 Primary Census Abstract district, and the Atlas population must be within 1% of that district's Census population.
      - id: code-historical-linguistic-distance-bounds
        file: R/measures/build_linguistic_distance_iv.R
        title: Bounding Historical Linguistic Distance with Unresolved Source Data
        description: >-
          Some 1991 Language Atlas population remains unresolved after language-name reconciliation. Rather than assigning that mass implicitly or dropping the affected district, the code bounds the speaker-weighted distance measure. It separates accepted positive-distance speakers from known groups excluded from that mean (zero-distance and native-English speakers), then lets unresolved population either leave the mean unchanged or lie anywhere on the positive-distance support observed in the reviewed preferred mapping. Pre-specified source-quality gates--not confidence levels--subsequently require at least 99% accepted speaker coverage and no more than half a Shastry degree of worst-case bound width before the preferred historical measure enters the analysis.
        outputs:
          - historical_language_persistence
      - id: code-dise-report-language-enrollment
        file: scripts/build_dise_report_language_enrollment.py
        section: Independent Schooling Measures and Survey Estimation
        title: Reconstructing English-Medium Enrollment from Archived DISE Reports
        description: >-
          District Information System for Education (DISE) report cards provide an independent administrative check on the NSS-based English-medium-instruction measure rather than an input to it. Reviewed PDF pages are converted with Poppler's layout-preserving `pdftotext -layout`, and the parser accepts either language rows under an identifiable total column or language columns paired with an explicit total row. It refuses to infer counts when those structural cues are missing; when multiple archived reports cover the same district-year, an explicit provenance priority must select one unique source.
        outputs:
          - dise_agreement
      - id: code-survey-design
        file: R/selection/estimate_selection_probit.R
        title: Constructing the NSS Survey Design
        description: >-
          The 2007--08 National Sample Survey (NSS) education survey samples households within first-stage units such as villages or urban blocks. This function constructs the joint sampling stratum from state, rural/urban sector, stratum, and substratum, supplies the household multiplier as the sampling weight, and creates the `survey::svydesign()` used for the enrollment probit. In the `survey` package, `nest = TRUE` relabels cluster identifiers to enforce nesting within strata; final estimation stops if any required design field is missing rather than falling back to an unweighted model.
      - id: code-ame-estimation
        file: R/selection/compute_average_marginal_effects.R
        title: Average Marginal Effects on the Estimation Sample
        description: >-
          The code recovers the exact observations and NSS sampling weights retained by the enrollment probit, checks that the weights align with those observations, and passes both to `marginaleffects::avg_slopes()`. The fitted survey design determines model estimation and its covariance matrix; the supplied weights separately determine how observation-level response-scale effects are averaged over the fitted sample. Continuous regressors are summarized by average response-scale slopes, while `marginaleffects` handles binary and categorical regressors as discrete comparisons rather than literal derivatives.
        outputs:
          - selection_ame
      - id: code-mop-effective-f
        file: R/iv/weak_identification.R
        section: Identification and Econometric Robustness
        title: Assessing Weak-Instrument Strength with the Montiel Olea--Pflueger Effective F
        description: >-
          The paper uses linguistic distance from Hindi as an instrument for district exposure to English-medium schooling. For specifications with one endogenous regressor, this function evaluates first-stage strength with the Montiel Olea--Pflueger effective F, using `momentfit::MOPtest()` with a 10% relative-bias benchmark for TSLS, 5% test size, and the conservative simplified critical value. It recovers the regressors, instruments, estimation rows, and state clusters from the fitted `ivreg` model first. The table pairs this strength diagnostic with two-stage least squares and Anderson--Rubin inference robust to weak identification.
        outputs:
          - weak_iv
      - id: code-falsification-adaptive-set
        file: R/iv/falsification_adaptive_set.R
        title: Constructing Falsification-Adaptive Sets for Overidentified IV Designs
        description: >-
          Under the exclusion-relaxation construction used here, one endogenous regressor and multiple instruments assumed relevant yield a falsification-adaptive set spanning just-identified IV estimands that use each excluded instrument in turn while conditioning on the others. This is an identified set, not a confidence interval. The code constructs every constituent on one common complete-case sample, estimates state-clustered inference and its conditional first stage, and forms the set only when every registered constituent is estimable. Weak sample first stages are reported as relevance cautions but never screen constituents out, which would make the set depend on a sample-based instrument-selection rule.
      - id: code-temporal-price-series
        file: R/prices/build_temporal_price_series.R
        section: Price Harmonization and Real Consumption
        title: Linking Historical and Later State CPI Series onto a Common Scale
        description: >-
          The historical Consumer Price Index for Rural Labourers (CPI-RL) and Consumer Price Index for Industrial Workers (CPI-IW) must be put onto the scale of the later state rural/urban CPI (CPI-R/U). For each state and rural/urban sector, the code uses the median monthly ratio of CPI-R/U to the historical index over January 2013--December 2014 as a multiplicative splice factor, which limits the influence of a single anomalous overlap month. It requires at least six common months and retains the overlap count and dispersion diagnostics alongside each link factor.
      - id: code-state-sector-deflator
        file: R/prices/price_deflators.R
        title: Constructing Comparable State-Sector Price Deflators
        description: >-
          Linking the CPI series handles price change over time, while Tendulkar state-sector poverty-line ratios provide a cross-sectional price-level adjustment relative to the all-India rural 2011--12 reference. The displayed core validates those spatial and temporal inputs, constructs or accepts a reference-period CPI for each state-sector series, preserves documented donor-series lineage when needed, and multiplies the spatial price relative by the temporal CPI relative. The resulting deflator combines a state-sector spatial price adjustment with temporal CPI adjustment; it is not an international PPP construction. The figure compares district estimates from the 2022--23 and 2023--24 Household Consumption Expenditure Survey rounds.
        outputs:
          - consumption_validation
      - id: code-price-link-tests
        file: tests/testthat/test-prices-and-controls.R
        title: Testing CPI Links Against Known Answers
        description: >-
          A small rural example has monthly new-to-old CPI ratios of 2, 2, and 3, so its registered median link factor must equal 2 even though the final overlap month implies 3; the urban example has a constant ratio of 0.5. The behavioral test verifies those median links, the first and last monthly ratios retained for diagnostics, and the number of overlap months.
      - id: code-public-map-rendering
        file: R/output/save_figures.R
        section: Spatial Presentation on a Common Geography
        title: Preserving the Complete District Universe in Published Maps
        description: >-
          Published district maps start from the complete 2001 Census geometry and left-join analysis attributes onto it rather than plotting only observations retained by a particular estimation sample. Districts without estimates therefore remain in the national outline as no-data areas. The code also reconstructs state identity from the canonical 2001 district key, checks it against any analysis-side state code, and passes the completed geometry to the shared public-map renderer.
        outputs:
          - main_maps
  - id: Under10MB
    label: UNDER-10MB COPY
    max_bytes: 10000000
    selective_rasterization: true
    excerpts: *main_code_excerpts
